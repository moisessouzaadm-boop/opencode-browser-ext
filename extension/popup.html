<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenCode Browser</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
    }
    .status-text {
      font-size: 14px;
      color: #374151;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #2563eb;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #test-result {
      margin-top: 8px;
      font-size: 11px;
      color: #374151;
      background: #f3f4f6;
      border-radius: 6px;
      padding: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="status">
    <div class="status-indicator" id="status-indicator"></div>
    <span class="status-text" id="status-text">Conectando...</span>
  </div>
  <div class="info">
    OpenCode Browser Extension ativa.<br>
    Conexão nativa ativa.
  </div>
  <button id="test-btn" disabled>Testar Conexão</button>
  <div id="test-result"></div>

  <script src="popup.js"></script>
</body>
</html>
